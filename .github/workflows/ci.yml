name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust (cargo fmt + clippy + test + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri/GTK system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry, git, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: cargo llvm-cov Office modules
        run: |
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --all-targets --json --summary-only --output-path src-tauri/target/llvm-cov-office-summary.json
          node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("src-tauri/target/llvm-cov-office-summary.json", "utf8"));
          const files = report.data?.[0]?.files ?? report.files ?? [];
          const targets = [
            "src-tauri/src/core/office_state.rs",
            "src-tauri/src/core/office_odt.rs",
            "src-tauri/src/core/office_preflight.rs",
            "src-tauri/src/commands/office.rs",
          ];
          const rows = files.filter(file => targets.some(target => file.filename.endsWith(target)));
          if (rows.length !== targets.length) {
            console.error("Missing Office coverage rows", {
              expected: targets,
              found: rows.map(file => file.filename),
            });
            process.exit(1);
          }
          let covered = 0;
          let count = 0;
          for (const file of rows) {
            const lines = file.summary?.lines ?? {};
            covered += Number(lines.covered ?? 0);
            count += Number(lines.count ?? 0);
            const percent = Number(lines.percent ?? 0).toFixed(2);
            console.log(`${file.filename}: ${percent}% line coverage`);
          }
          console.log(`Office core/commands aggregate: ${count ? ((covered / count) * 100).toFixed(2) : "0.00"}% line coverage`);
          NODE

  js:
    name: JS (check + test + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm ci
        run: npm ci

      - name: npm run check:js
        run: npm run check:js

      - name: npm run test:js
        run: npm run test:js

      - name: node:test coverage (office wizard)
        run: node --test --experimental-test-coverage src/office-wizard.test.js
