[package]
name = "winbox-gui"
version = "0.1.0"
description = "GUI for winbox — Windows VM manager"
authors = ["Bruno Santos"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "winbox_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
dialoguer = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
walkdir = "2"
which = "6"
# Cross-platform host info (RAM, disk). Replaces /proc + df so the same
# code reports correct numbers on Linux and Windows (WMI under the hood).
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
